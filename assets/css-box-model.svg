<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .box-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .dim-text { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #64748b; }
      .prop-text { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="label-title">📦 CSS Box Model Architecture</text>

  <!-- Margin Outer Box -->
  <rect x="50" y="60" width="700" height="390" rx="16" fill="#fed7aa" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)"/>
  <text x="70" y="90" class="prop-text" fill="#9a3412">MARGIN (គម្លាតខាងក្រៅ)</text>
  <text x="400" y="80" text-anchor="middle" class="dim-text">margin-top</text>
  <text x="400" y="435" text-anchor="middle" class="dim-text">margin-bottom</text>
  <text x="90" y="255" text-anchor="middle" class="dim-text" transform="rotate(-90 90 255)">margin-left</text>
  <text x="710" y="255" text-anchor="middle" class="dim-text" transform="rotate(90 710 255)">margin-right</text>

  <!-- Border Box -->
  <rect x="130" y="110" width="540" height="290" rx="12" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
  <text x="150" y="140" class="prop-text" fill="#854d0e">BORDER (បន្ទាត់ព្រំដែន)</text>
  <text x="400" y="130" text-anchor="middle" class="dim-text">border-top</text>
  <text x="400" y="385" text-anchor="middle" class="dim-text">border-bottom</text>
  <text x="165" y="255" text-anchor="middle" class="dim-text" transform="rotate(-90 165 255)">border-left</text>
  <text x="635" y="255" text-anchor="middle" class="dim-text" transform="rotate(90 635 255)">border-right</text>

  <!-- Padding Box -->
  <rect x="200" y="160" width="400" height="190" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="190" class="prop-text" fill="#166534">PADDING (គម្លាតខាងក្នុង)</text>
  <text x="400" y="180" text-anchor="middle" class="dim-text">padding-top</text>
  <text x="400" y="335" text-anchor="middle" class="dim-text">padding-bottom</text>
  <text x="235" y="255" text-anchor="middle" class="dim-text" transform="rotate(-90 235 255)">padding-left</text>
  <text x="565" y="255" text-anchor="middle" class="dim-text" transform="rotate(90 565 255)">padding-right</text>

  <!-- Content Box -->
  <rect x="270" y="210" width="260" height="90" rx="6" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="250" text-anchor="middle" class="prop-text" fill="#1e40af" font-size="16">CONTENT</text>
  <text x="400" y="275" text-anchor="middle" class="box-text" fill="#1e3a8a">width × height (Text / Images)</text>

  <!-- Footer Formula Note -->
  <rect x="150" y="465" width="500" height="28" rx="6" fill="#f1f5f9"/>
  <text x="400" y="484" text-anchor="middle" class="dim-text" fill="#334155" font-weight="bold">Total Width = width + padding-left + padding-right + border-left + border-right</text>
</svg>
