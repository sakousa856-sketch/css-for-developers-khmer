<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; }
      .badge { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: bold; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .code-snip { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    </style>
  </defs>

  <rect width="900" height="450" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="40" text-anchor="middle" class="title">⚖️ CSS Specificity Hierarchy &amp; Weight Score</text>
  <text x="450" y="65" text-anchor="middle" class="desc">កាលណាពិន្ទុ Specificity កាន់តែខ្ពស់ Style នោះនឹងមានអាទិភាពឈ្នះយកទៅបង្ហាញ</text>

  <!-- Level 1: Inline Style (1000) -->
  <g transform="translate(40, 90)">
    <rect width="180" height="270" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <rect x="20" y="20" width="140" height="36" rx="18" fill="#ef4444"/>
    <text x="90" y="44" text-anchor="middle" class="badge" fill="#ffffff">Score: 1-0-0-0</text>
    <text x="90" y="85" text-anchor="middle" class="card-title" fill="#991b1b">Inline Style</text>
    <text x="90" y="115" text-anchor="middle" class="desc">សរសេរក្នុង tag</text>
    <rect x="15" y="140" width="150" height="50" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="25" y="170" class="code-snip" fill="#dc2626">style="color:red"</text>
    <text x="90" y="230" text-anchor="middle" class="desc" font-weight="bold" fill="#b91c1c">អាទិភាពខ្ពស់បំផុត</text>
  </g>

  <!-- Level 2: ID Selector (0100) -->
  <g transform="translate(250, 90)">
    <rect width="180" height="270" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <rect x="20" y="20" width="140" height="36" rx="18" fill="#f59e0b"/>
    <text x="90" y="44" text-anchor="middle" class="badge" fill="#ffffff">Score: 0-1-0-0</text>
    <text x="90" y="85" text-anchor="middle" class="card-title" fill="#92400e">ID Selector</text>
    <text x="90" y="115" text-anchor="middle" class="desc">ប្រើសញ្ញា Hash (#)</text>
    <rect x="15" y="140" width="150" height="50" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="25" y="170" class="code-snip" fill="#d97706">#header { ... }</text>
    <text x="90" y="230" text-anchor="middle" class="desc" font-weight="bold" fill="#b45309">ឈ្នះ Class &amp; Element</text>
  </g>

  <!-- Level 3: Class & Pseudo-class (0010) -->
  <g transform="translate(460, 90)">
    <rect width="180" height="270" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="20" y="20" width="140" height="36" rx="18" fill="#3b82f6"/>
    <text x="90" y="44" text-anchor="middle" class="badge" fill="#ffffff">Score: 0-0-1-0</text>
    <text x="90" y="85" text-anchor="middle" class="card-title" fill="#1e40af">Class &amp; Pseudo</text>
    <text x="90" y="115" text-anchor="middle" class="desc">.class, [attr], :hover</text>
    <rect x="15" y="140" width="150" height="50" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="25" y="170" class="code-snip" fill="#2563eb">.btn:hover { ... }</text>
    <text x="90" y="230" text-anchor="middle" class="desc" font-weight="bold" fill="#1d4ed8">ស្តង់ដារប្រើញឹកញាប់</text>
  </g>

  <!-- Level 4: Element & Pseudo-element (0001) -->
  <g transform="translate(670, 90)">
    <rect width="180" height="270" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <rect x="20" y="20" width="140" height="36" rx="18" fill="#64748b"/>
    <text x="90" y="44" text-anchor="middle" class="badge" fill="#ffffff">Score: 0-0-0-1</text>
    <text x="90" y="85" text-anchor="middle" class="card-title" fill="#334155">Element / Tag</text>
    <text x="90" y="115" text-anchor="middle" class="desc">h1, p, div, ::before</text>
    <rect x="15" y="140" width="150" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="25" y="170" class="code-snip" fill="#475569">h1 { ... }</text>
    <text x="90" y="230" text-anchor="middle" class="desc" font-weight="bold" fill="#475569">អាទិភាពទាបបំផុត</text>
  </g>

  <!-- Bottom Important Alert -->
  <rect x="100" y="385" width="700" height="42" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
  <text x="450" y="411" text-anchor="middle" class="desc" fill="#991b1b">
    🚨 <tspan font-weight="bold" fill="#dc2626">!important</tspan> អាច Override ឈ្នះ Specificity ទាំងអស់ ប៉ុន្តែគួរចៀសវាងព្រោះវាធ្វើឱ្យខូច Specificity Architecture!
  </text>
</svg>
