<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .axis-title { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: bold; }
      .box-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="880" height="460" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="440" y="38" text-anchor="middle" class="title">⚡ CSS Flexbox Architecture &amp; Axes System</text>

  <!-- Flex Container Outer -->
  <rect x="80" y="80" width="720" height="310" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="100" y="105" class="box-label" fill="#475569">Flex Container (display: flex; flex-direction: row;)</text>

  <!-- Main Axis Arrow (Horizontal) -->
  <line x1="120" y1="135" x2="740" y2="135" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="440" y="125" text-anchor="middle" class="axis-title" fill="#1d4ed8">MAIN AXIS ➔ (គ្រប់គ្រងដោយ justify-content)</text>

  <!-- Cross Axis Arrow (Vertical) -->
  <line x1="105" y1="160" x2="105" y2="360" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="75" y="260" text-anchor="middle" class="axis-title" fill="#15803d" transform="rotate(-90 75 260)">CROSS AXIS ➔ (align-items)</text>

  <!-- Flex Items inside -->
  <g transform="translate(140, 170)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="160" height="170" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="75" text-anchor="middle" class="box-label" fill="#1e40af">Flex Item 1</text>
    <text x="80" y="105" text-anchor="middle" class="desc">flex-grow: 1</text>

    <!-- Item 2 -->
    <rect x="180" y="0" width="160" height="170" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="260" y="75" text-anchor="middle" class="box-label" fill="#1e40af">Flex Item 2</text>
    <text x="260" y="105" text-anchor="middle" class="desc">flex-grow: 1</text>

    <!-- Item 3 -->
    <rect x="360" y="0" width="160" height="170" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="440" y="75" text-anchor="middle" class="box-label" fill="#1e40af">Flex Item 3</text>
    <text x="440" y="105" text-anchor="middle" class="desc">flex-grow: 1</text>
  </g>

  <!-- Gap indicator -->
  <text x="310" y="365" text-anchor="middle" class="desc" font-weight="bold" fill="#64748b">gap: 20px</text>
  <text x="490" y="365" text-anchor="middle" class="desc" font-weight="bold" fill="#64748b">gap: 20px</text>

  <!-- Footer explanation note -->
  <rect x="80" y="405" width="720" height="35" rx="6" fill="#eff6ff"/>
  <text x="440" y="428" text-anchor="middle" class="desc" fill="#1e40af">
    💡 បើប្តូរ <tspan font-weight="bold">flex-direction: column</tspan> នោះ Main Axis នឹងក្លាយជាបញ្ឈរ (Vertical) ហើយ Cross Axis ក្លាយជាផ្ដេក (Horizontal) វិញភ្លាម!
  </text>
</svg>
