<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .step-num { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 16px; font-weight: bold; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: bold; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect width="900" height="450" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="38" text-anchor="middle" class="title">🌊 The CSS Cascade Algorithm (របៀបដែល CSS សម្រេចចិត្តយក Style មក Render)</text>

  <!-- Step 1: Importance & Origin -->
  <g transform="translate(60, 80)">
    <rect width="780" height="70" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="45" cy="35" r="22" fill="#ef4444"/>
    <text x="45" y="41" text-anchor="middle" class="step-num" fill="#ffffff">1</text>
    <text x="85" y="30" class="step-title" fill="#991b1b">Importance &amp; Origin (ប្រភព និងភាពបន្ទាន់)</text>
    <text x="85" y="52" class="desc">!important ឈ្នះធម្មតា > User styles > Author styles (Developer) > Browser default styles (User Agent)</text>
  </g>

  <!-- Arrow down -->
  <text x="450" y="170" text-anchor="middle" font-size="20" fill="#94a3b8">↓</text>

  <!-- Step 2: Specificity -->
  <g transform="translate(60, 185)">
    <rect width="780" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="45" cy="35" r="22" fill="#f59e0b"/>
    <text x="45" y="41" text-anchor="middle" class="step-num" fill="#ffffff">2</text>
    <text x="85" y="30" class="step-title" fill="#92400e">Specificity Score (ពិន្ទុអានុភាពនៃ Selector)</text>
    <text x="85" y="52" class="desc">Inline style (1,0,0,0) > ID (#id: 0,1,0,0) > Class/Pseudo (.class: 0,0,1,0) > Element (tag: 0,0,0,1)</text>
  </g>

  <!-- Arrow down -->
  <text x="450" y="275" text-anchor="middle" font-size="20" fill="#94a3b8">↓</text>

  <!-- Step 3: Order of Appearance -->
  <g transform="translate(60, 290)">
    <rect width="780" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="45" cy="35" r="22" fill="#3b82f6"/>
    <text x="45" y="41" text-anchor="middle" class="step-num" fill="#ffffff">3</text>
    <text x="85" y="30" class="step-title" fill="#1e40af">Source Order (លំដាប់កូដដែលសរសេរចុងក្រោយគេបង្អស់)</text>
    <text x="85" y="52" class="desc">បើពិន្ទុ Specificity ស្មើគ្នា នោះកូដណាដែលសរសេរនៅក្រោមគេ ឬក្រោយគេក្នុង file នឹងឈ្នះ (The Last Rule Wins)</text>
  </g>

  <!-- Winner box -->
  <rect x="250" y="380" width="400" height="45" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#15803d">
    🎉 Final Computed Style (Rendered on Screen)
  </text>
</svg>
