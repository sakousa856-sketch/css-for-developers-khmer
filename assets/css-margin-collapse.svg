<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 13px; fill: #64748b; }
      .card-title { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .box-text { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; }
      .margin-label { font-family: monospace, system-ui; font-size: 13px; font-weight: 600; fill: #d97706; }
      .calc-title { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
      .calc-sub { font-family: system-ui, monospace; font-size: 13px; fill: #ef4444; font-weight: 700; }
      .calc-pass { font-family: system-ui, monospace; font-size: 13px; fill: #10b981; font-weight: 700; }
      .tag { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    </style>
    <linearGradient id="box1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="box2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <pattern id="diagonalHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#fef3c7" stroke-width="4" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#fde68a" stroke-width="4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="45" class="title">📐 CSS Margin Collapse Mechanism (យន្តការស្រូប Margin បញ្ឈរ)</text>
  <text x="40" y="70" class="subtitle">ពេល Element ពីរប៉ះគ្នាបញ្ឈរ (Vertical) គម្លាត Margin របស់ពួកវាមិនបូកបញ្ចូលគ្នាទេ គឺជ្រើសយកតែ Margin ណាដែលធំជាងគេ!</text>

  <!-- Left Column: What Beginners Expect (Addition) -->
  <g transform="translate(40, 95)">
    <rect width="340" height="345" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="340" height="36" rx="12" fill="#fee2e2"/>
    <text x="170" y="24" text-anchor="middle" font-family="'Kantumruy Pro', sans-serif" font-size="13" font-weight="700" fill="#991b1b">❌ អ្វីដែលអ្នកទើបរៀនគិត (Expectation)</text>

    <!-- Box 1 -->
    <rect x="50" y="55" width="240" height="60" rx="8" fill="url(#box1Grad)"/>
    <text x="170" y="90" text-anchor="middle" class="box-text">Box 1 (margin-bottom: 20px)</text>

    <!-- False Margin 1 -->
    <rect x="50" y="115" width="240" height="30" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="3,3"/>
    <text x="170" y="135" text-anchor="middle" font-family="monospace" font-size="12" fill="#b45309">20px margin</text>

    <!-- False Margin 2 -->
    <rect x="50" y="145" width="240" height="45" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="3,3"/>
    <text x="170" y="172" text-anchor="middle" font-family="monospace" font-size="12" fill="#b45309">30px margin</text>

    <!-- Box 2 -->
    <rect x="50" y="190" width="240" height="60" rx="8" fill="url(#box2Grad)"/>
    <text x="170" y="225" text-anchor="middle" class="box-text">Box 2 (margin-top: 30px)</text>

    <!-- Expectation Result -->
    <rect x="25" y="270" width="290" height="55" rx="8" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="170" y="293" text-anchor="middle" class="calc-title">គម្លាតសរុបដែលគិតថាចេញ៖</text>
    <text x="170" y="313" text-anchor="middle" class="calc-sub">20px + 30px = 50px (ខុស)</text>
  </g>

  <!-- Right Column: How CSS Actually Works (Collapse) -->
  <g transform="translate(420, 95)">
    <rect width="340" height="345" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect width="340" height="36" rx="12" fill="#d1fae5"/>
    <text x="170" y="24" text-anchor="middle" font-family="'Kantumruy Pro', sans-serif" font-size="13" font-weight="700" fill="#065f46">✅ ការពិតក្នុង Browser (Actual Behavior)</text>

    <!-- Box 1 -->
    <rect x="50" y="55" width="240" height="60" rx="8" fill="url(#box1Grad)"/>
    <text x="170" y="90" text-anchor="middle" class="box-text">Box 1 (margin-bottom: 20px)</text>

    <!-- Collapsed Margin Area -->
    <rect x="50" y="115" width="240" height="45" fill="#fef3c7" stroke="#10b981" stroke-width="2"/>
    <text x="170" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#047857">✨ Collapsed Gap = 30px</text>

    <!-- Box 2 -->
    <rect x="50" y="160" width="240" height="60" rx="8" fill="url(#box2Grad)"/>
    <text x="170" y="195" text-anchor="middle" class="box-text">Box 2 (margin-top: 30px)</text>

    <!-- Reality Result -->
    <rect x="25" y="250" width="290" height="75" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="170" y="275" text-anchor="middle" class="calc-title">រូបមន្តគណនាពិតប្រាកដ៖</text>
    <text x="170" y="297" text-anchor="middle" class="calc-pass">max(20px, 30px) = 30px</text>
    <text x="170" y="315" text-anchor="middle" font-family="'Kantumruy Pro', sans-serif" font-size="11" fill="#065f46">Margin 20px ត្រូវរលាយស្រូបចូលក្នុង 30px</text>
  </g>
</svg>
