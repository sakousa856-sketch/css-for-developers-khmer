<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 13px; fill: #64748b; }
      .layer-badge { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .layer-name { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .layer-code { font-family: monospace; font-size: 12px; font-weight: 700; fill: #2563eb; }
      .layer-detail { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 12px; fill: #475569; }
    </style>
    <linearGradient id="bgMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="blurBg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="45" class="title">✨ Glassmorphism 4-Layer Architecture (រូបមន្ត ៤ ស្រទាប់នៃកញ្ចក់ថ្លា)</text>
  <text x="40" y="70" class="subtitle">ដើម្បីបង្កើត Frosted Glass Effect ដែលស្អាត និងលេចធ្លោ យើងត្រូវការផ្សំ ៤ ធាតុនេះជាមួយគ្នា</text>

  <!-- Left: Visual 4-layer Stack Graphic -->
  <g transform="translate(40, 105)">
    <!-- Layer 1: Vibrant Background -->
    <g transform="translate(0, 0)">
      <rect width="360" height="75" rx="10" fill="url(#bgMesh)"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#0f172a" fill-opacity="0.8"/>
      <text x="29" y="34" text-anchor="middle" class="layer-badge">1</text>
      <text x="55" y="32" font-family="'Kantumruy Pro', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Vibrant Background</text>
      <text x="55" y="52" font-family="monospace" font-size="11" fill="#f1f5f9">Gradients, Images, Shapes</text>
    </g>

    <!-- Layer 2: Backdrop Filter Blur -->
    <g transform="translate(0, 90)">
      <rect width="360" height="75" rx="10" fill="#ffffff" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#3b82f6"/>
      <text x="29" y="34" text-anchor="middle" class="layer-badge">2</text>
      <text x="55" y="32" font-family="'Kantumruy Pro', sans-serif" font-size="14" font-weight="700" fill="#1e40af">Frosted Blur Engine</text>
      <text x="55" y="52" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb">backdrop-filter: blur(12px);</text>
    </g>

    <!-- Layer 3: Semi-Transparent Fill -->
    <g transform="translate(0, 180)">
      <rect width="360" height="75" rx="10" fill="#ffffff" fill-opacity="0.8" stroke="#10b981" stroke-width="1.5"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#10b981"/>
      <text x="29" y="34" text-anchor="middle" class="layer-badge">3</text>
      <text x="55" y="32" font-family="'Kantumruy Pro', sans-serif" font-size="14" font-weight="700" fill="#065f46">Translucent Color Fill</text>
      <text x="55" y="52" font-family="monospace" font-size="12" font-weight="700" fill="#059669">background: rgba(255,255,255,0.2);</text>
    </g>

    <!-- Layer 4: Border & Shadow -->
    <g transform="translate(0, 270)">
      <rect width="360" height="75" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#f59e0b"/>
      <text x="29" y="34" text-anchor="middle" class="layer-badge">4</text>
      <text x="55" y="32" font-family="'Kantumruy Pro', sans-serif" font-size="14" font-weight="700" fill="#92400e">Glass Edge &amp; Shadow</text>
      <text x="55" y="52" font-family="monospace" font-size="11" fill="#b45309">border: 1px solid rgba(255,255,255,0.3);</text>
    </g>
  </g>

  <!-- Right: Live Result Card & Complete CSS Snippet -->
  <g transform="translate(430, 105)">
    <rect width="410" height="345" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <g transform="translate(20, 20)">
      <text x="0" y="15" class="layer-name">💻 កូដ CSS ពេញលេញសម្រាប់ Glass Card:</text>

      <!-- Code Box -->
      <rect x="0" y="30" width="370" height="175" rx="8" fill="#0f172a"/>
      <g transform="translate(15, 50)" font-family="monospace" font-size="12" fill="#38bdf8">
        <text x="0" y="0"><tspan fill="#f43f5e">.glass-card</tspan> {</text>
        <text x="15" y="20"><tspan fill="#94a3b8">/* 1. Translucent Tint */</tspan></text>
        <text x="15" y="38">background: <tspan fill="#facc15">rgba(255, 255, 255, 0.2)</tspan>;</text>
        <text x="15" y="58"><tspan fill="#94a3b8">/* 2. Frosted Blur */</tspan></text>
        <text x="15" y="76">backdrop-filter: <tspan fill="#facc15">blur(12px)</tspan>;</text>
        <text x="15" y="96"><tspan fill="#94a3b8">/* 3. Subtle Glass Border &amp; Radius */</tspan></text>
        <text x="15" y="114">border: <tspan fill="#facc15">1px solid rgba(255,255,255,0.3)</tspan>;</text>
        <text x="15" y="132">border-radius: <tspan fill="#facc15">16px</tspan>;</text>
        <text x="0" y="150">}</text>
      </g>

      <!-- Live Mockup inside -->
      <g transform="translate(0, 220)">
        <rect width="370" height="90" rx="8" fill="url(#bgMesh)"/>
        <rect x="30" y="12" width="310" height="66" rx="10" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="1.5"/>
        <text x="185" y="42" text-anchor="middle" font-family="'Kantumruy Pro', sans-serif" font-size="13" font-weight="700" fill="#ffffff">✨ Real Glassmorphism Preview</text>
        <text x="185" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f8fafc">Frosted &amp; Blur in Real-time</text>
      </g>
    </g>
  </g>
</svg>
