<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 13px; fill: #64748b; }
      .layer-title { font-family: monospace, system-ui; font-size: 14px; font-weight: 700; }
      .layer-desc { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 12px; fill: #334155; }
      .rule-title { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .rule-text { font-family: 'Kantumruy Pro', system-ui, sans-serif; font-size: 12px; fill: #475569; }
    </style>
    <filter id="layerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="500" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="45" class="title">📚 CSS Z-Index &amp; 3D Stacking Context (លំដាប់ស្រទាប់ 3D)</text>
  <text x="40" y="70" class="subtitle">z-index ដំណើរការបានលុះត្រាតែ Element នោះមាន Position (relative, absolute, fixed, sticky) ប៉ុណ្ណោះ!</text>

  <!-- Left: 3D Isometric Stack Visual -->
  <g transform="translate(40, 100)">
    <!-- Bottom Layer: Negative Z-index -->
    <polygon points="120,280 340,280 260,330 40,330" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" filter="url(#layerShadow)"/>
    <text x="180" y="312" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#475569">z-index: -1 (Background Decor)</text>

    <!-- Normal Flow Layer (z-index: auto / 0) -->
    <polygon points="140,210 360,210 280,260 60,260" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5" filter="url(#layerShadow)"/>
    <text x="200" y="242" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#1e40af">z-index: 0 (Normal Document Flow)</text>

    <!-- Mid Layer: Dropdowns / Sticky (z-index: 10 - 100) -->
    <polygon points="160,140 380,140 300,190 80,190" fill="#a7f3d0" stroke="#10b981" stroke-width="1.5" filter="url(#layerShadow)"/>
    <text x="220" y="172" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065f46">z-index: 100 (Sticky Navbar, Dropdowns)</text>

    <!-- Top Layer: Modal / Popups (z-index: 1000+) -->
    <polygon points="180,70 400,70 320,120 100,120" fill="#fde68a" stroke="#f59e0b" stroke-width="2" filter="url(#layerShadow)"/>
    <text x="240" y="102" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#92400e">z-index: 1000 (Modal Dialog, Toast)</text>

    <!-- Z-Axis Indicator Arrow -->
    <line x1="30" y1="340" x2="160" y2="40" stroke="#6366f1" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="160,40 148,50 156,58" fill="#6366f1"/>
    <text x="60" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4338ca">Z-Axis (+)</text>
  </g>

  <!-- Right: Breakdown Rules & Best Practice -->
  <g transform="translate(460, 100)">
    <rect width="340" height="355" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <g transform="translate(20, 20)">
      <text x="0" y="15" class="rule-title">⚡ ច្បាប់មាសនៃ Z-Index (Golden Rules):</text>

      <!-- Step 1 -->
      <rect x="0" y="30" width="300" height="60" rx="8" fill="#eff6ff"/>
      <text x="12" y="52" class="layer-title" fill="#1d4ed8">1. Position Requirement</text>
      <text x="12" y="73" class="rule-text">Element ត្រូវតែមាន <tspan font-family="monospace" fill="#1d4ed8">position: relative/absolute/fixed</tspan></text>

      <!-- Step 2 -->
      <rect x="0" y="100" width="300" height="60" rx="8" fill="#ecfdf5"/>
      <text x="12" y="122" class="layer-title" fill="#047857">2. Higher Number Stacks on Top</text>
      <text x="12" y="143" class="rule-text">លេខកាន់តែធំ អណ្តែតមកខាងមុខកាន់តែខ្ពស់</text>

      <!-- Step 3 -->
      <rect x="0" y="170" width="300" height="60" rx="8" fill="#fffbeb"/>
      <text x="12" y="192" class="layer-title" fill="#b45309">3. Stacking Context Trap</text>
      <text x="12" y="213" class="rule-text">កូនមិនអាចអណ្តែតខ្ពស់ជាង Parent របស់គេបានឡើយ</text>

      <!-- Industry Scale Tip -->
      <rect x="0" y="240" width="300" height="75" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="12" y="260" font-family="'Kantumruy Pro', sans-serif" font-size="12" font-weight="700" fill="#0f172a">🎯 ស្តង់ដារ Z-Index ក្នុងក្រុមហ៊ុនធំៗ:</text>
      <text x="12" y="280" font-family="monospace" font-size="11" fill="#475569">Navbar: 100 | Drawer: 500</text>
      <text x="12" y="298" font-family="monospace" font-size="11" fill="#475569">Modal: 1000 | Toast Alert: 2000</text>
    </g>
  </g>
</svg>
