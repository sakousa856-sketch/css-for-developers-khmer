<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 07: Modern Animations & Glassmorphism</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Kantumruy Pro', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, #4338ca, #0f172a, #0369a1);
      color: white;
      padding: 20px;
    }

    /* Floating Keyframe Animation */
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    /* Glassmorphism Card */
    .glass-card {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: floatCard 4s ease-in-out infinite;
    }

    .badge-neon {
      display: inline-block;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    h2 {
      font-size: 26px;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-glass {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-glass:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.6);
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <div class="badge-neon">CSS3 ADVANCED</div>
    <h2>✨ Glassmorphism &amp; Animation</h2>
    <p>
      ការរួមបញ្ចូលរវាង <code>backdrop-filter: blur()</code> និង Keyframe Animation បង្កើតបទពិសោធន៍ UI ដ៏អស្ចារ្យកម្រិត State-of-the-Art។
    </p>
    <button class="btn-glass">សាកល្បងឥឡូវនេះ</button>
  </div>

</body>
</html>
